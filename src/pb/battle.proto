syntax = "proto3";
package pb;

import "google/protobuf/timestamp.proto";

option go_package = "battleworld/pb";

message PlayerView {
    string username = 1;
    string map_id = 2;
    int32 x = 3;
    int32 y = 4;
    int32 hp = 5;
    int32 max_hp = 6;
    int32 attack = 7;
    int32 potions = 8;
    int32 treasures = 9;
    int32 kills = 10;
    int32 deaths = 11;
    int32 victories = 12;
    bool alive = 13;
    int32 respawn_in = 14;
    string last_update = 15;
}

message NPCView {
    string id = 1;
    string name = 2;
    int32 x = 3;
    int32 y = 4;
    int32 hp = 5;
    int32 max_hp = 6;
    int32 attack = 7;
    bool alive = 8;
}

message TreasureView {
    string id = 1;
    string kind = 2;
    int32 x = 3;
    int32 y = 4;
    int32 value = 5;
}

message MapBrief {
    string id = 1;
    string name = 2;
    string node_id = 3;
    int32 players = 4;
    int32 npcs = 5;
    int32 treasures = 6;
    int64 version = 7;
    bool primary = 8;
    bool is_current = 9;
    int64 checkpoint = 10;
}

message NodeView {
    string id = 1;
    string addr = 2;
    bool healthy = 3;
    repeated string primary_maps = 4;
    string last_heartbeat = 6;
}

message MapView {
    string id = 1;
    string name = 2;
    string node_id = 3;
    int32 width = 4;
    int32 height = 5;
    repeated string terrain = 6;
    repeated PlayerView players = 7;
    repeated NPCView npcs = 8;
    repeated TreasureView treasures = 9;
    int64 version = 10;
}

message BossSite {
    string map_id = 1;
    int32 x = 2;
    int32 y = 3;
}

message BossView {
    string name = 1;
    int32 hp = 2;
    int32 max_hp = 3;
    bool alive = 4;
    string last_hit = 5;
    int32 respawn_in = 6;
    int32 attack_gap = 7;
    repeated BossSite sites = 8;
    int64 version = 9;
}

message WorldState {
PlayerView self = 1;
MapView map = 2;
repeated MapBrief maps = 3;
repeated NodeView nodes = 4;
BossView boss = 5;
repeated string events = 6;
int64 session_version = 7;
uint64 topology_version = 8;
uint64 map_epoch = 9;
}

// GatewayService exposes the typed bidirectional game stream.
service GatewayService {
    rpc GameStream(stream ClientEnvelope) returns (stream ServerEnvelope);
}

// Direction is deliberately closed at the Gateway boundary. UNSPECIFIED and unknown
// numeric values are invalid client input and must be rejected by the stream handler.
enum Direction {
    DIRECTION_UNSPECIFIED = 0;
    DIRECTION_UP = 1;
    DIRECTION_DOWN = 2;
    DIRECTION_LEFT = 3;
    DIRECTION_RIGHT = 4;
}

// ErrorCode is stable client-facing error taxonomy. Clients must branch on code rather
// than parsing ErrorResponse.message. New values are append-only.
enum ErrorCode {
    ERROR_CODE_UNSPECIFIED = 0;
    ERROR_CODE_INVALID_REQUEST = 1;
    ERROR_CODE_AUTH_FAILED = 2;
    ERROR_CODE_ROUTE_NOT_READY = 3;
    ERROR_CODE_STALE_ROUTE = 4;
    ERROR_CODE_COMMAND_REJECTED = 5;
    ERROR_CODE_INTERNAL = 6;
}

// ClientEnvelope carries exactly one authentication request or player command.
// request_id must be non-zero and unique among a live client's outstanding requests.
// An empty payload, an unknown enum value, or a command before authentication is an
// INVALID_REQUEST in the stream handler.
message ClientEnvelope {
    uint64 request_id = 1;

    oneof payload {
        LoginRequest login = 10;
        RegisterRequest register = 11;
        QuickEnterRequest quick_enter = 12;

        MoveCommand move = 20;
        AttackCommand attack = 21;
        AttackBossCommand attack_boss = 22;
        HealCommand heal = 23;
        BuyItemCommand buy_item = 24;
        SwitchMapCommand switch_map = 25;
        LogoutCommand logout = 26;
    }
}

// LoginRequest is the initial credential exchange for an existing player. Terminal
// APIs intentionally never expose a password_hash field.
message LoginRequest {
    string username = 1;
    string password = 2;
}

// RegisterRequest creates a player and immediately authenticates that player.
message RegisterRequest {
    string username = 1;
    string password = 2;
    string confirm_password = 3;
}

// QuickEnterRequest creates the player when absent, then authenticates it.
message QuickEnterRequest {
    string username = 1;
    string password = 2;
}

message MoveCommand {
    Direction direction = 1;
}

message AttackCommand {}

message AttackBossCommand {}

message HealCommand {}

message BuyItemCommand {
    string item = 1;
}

message SwitchMapCommand {
    string map_id = 1;
}

message LogoutCommand {}

// ServerEnvelope is written by a single stream writer. Authentication outcomes,
// command outcomes, errors, and notices are reliable control messages. State updates
// are mergeable: an implementation may replace queued state with the latest snapshot.
message ServerEnvelope {
    // Echoes the triggering ClientEnvelope.request_id for auth, command results, and
    // errors. Proactive state updates always use request_id = 0.
    uint64 request_id = 1;

    oneof payload {
        Authenticated authenticated = 10;
        CommandResult command_result = 20;
        // Clients may coalesce states, but must never replace a newer same-map state
        // with one whose topology_version, map_epoch, or session_version regresses.
        WorldState state = 30;
        ErrorResponse error = 40;
        ServerNotice notice = 50;
    }
}

message Authenticated {
    WorldState state = 1;
}

// CommandResult confirms that a command was accepted. Its request_id is carried by the
// enclosing ServerEnvelope; a corresponding state update is delivered separately.
message CommandResult {
    string message = 1;
}

message ErrorResponse {
    ErrorCode code = 1;
    string message = 2;
    bool retryable = 3;
}

message ServerNotice {
    string message = 1;
}

// AdminService is intentionally separate from player streams. It can evolve its
// authorization independently and never needs a synthetic player authentication frame.
service AdminService {
    rpc GetGatewayStatus(GatewayStatusRequest) returns (GatewayStatusResponse);
}

message GatewayStatusRequest {}

message GatewayStatusResponse {
    bool routing_ready = 1;
    uint64 topology_version = 2;
    repeated NodeView nodes = 3;
    string summary = 4;
}

// NodeService is the typed Node RPC contract used by Gateway and Coordinator.
// Every map mutation carries MapAuthority so the node can fence stale owners before
// world state changes; no Node data-plane payload includes an account password hash.
service NodeService {
    rpc Ping(NodePingRequest) returns (NodePingResponse);
    rpc AddPlayer(NodeAddPlayerRequest) returns (NodeAddPlayerResponse);
    rpc RemovePlayer(NodeRemovePlayerRequest) returns (NodeRemovePlayerResponse);
    rpc MovePlayer(NodeMovePlayerRequest) returns (NodePlayerActionResponse);
    rpc Attack(NodeAttackRequest) returns (NodeAttackResponse);
    rpc Heal(NodePlayerRequest) returns (NodePlayerActionResponse);
    rpc BuyItem(NodeBuyItemRequest) returns (NodePlayerActionResponse);
    rpc AttackBoss(NodePlayerRequest) returns (NodePlayerActionResponse);
    rpc Profile(NodeProfileRequest) returns (NodeProfileResponse);
    rpc RewardPlayer(NodeRewardPlayerRequest) returns (NodeProfileResponse);
    rpc Snapshot(NodeSnapshotRequest) returns (NodeSnapshotResponse);
    rpc Counts(NodeCountsRequest) returns (NodeCountsResponse);
    rpc Checkpoint(NodeCheckpointRequest) returns (NodeCheckpointResponse);
    rpc Promote(NodePromoteRequest) returns (NodePromoteResponse);
    rpc View(NodeViewRequest) returns (NodeViewResponse);
}

// MapAuthority is the immutable topology proof attached to every map write.
// owner_node_id allows nodes to reject malformed calls before their local/Redis
// authority checks; map_epoch is the fencing token enforced at the write point.
message MapAuthority {
    string map_id = 1;
    string owner_node_id = 2;
    uint64 map_epoch = 3;
}

// PlayerState is the Node data-plane player model. It deliberately excludes
// password_hash, which belongs only to the account storage boundary.
message PlayerState {
    string username = 1;
    string last_map = 2;
    string last_node = 3;
    int32 x = 4;
    int32 y = 5;
    int32 hp = 6;
    int32 max_hp = 7;
    int32 attack = 8;
    int32 potions = 9;
    int32 treasures = 10;
    int32 kills = 11;
    int32 deaths = 12;
    int32 victories = 13;
    bool alive = 14;
}

message NodePingRequest {}

message NodePingResponse {
    google.protobuf.Timestamp observed_at = 1;
}

message NodeAddPlayerRequest {
    MapAuthority authority = 1;
    PlayerState player = 2;
}

message NodeAddPlayerResponse {}

message NodeRemovePlayerRequest {
    MapAuthority authority = 1;
    string username = 2;
}

message NodeRemovePlayerResponse {
    PlayerState player = 1;
    bool removed = 2;
}

message NodeMovePlayerRequest {
    MapAuthority authority = 1;
    string username = 2;
    Direction direction = 3;
}

message NodePlayerRequest {
    MapAuthority authority = 1;
    string username = 2;
}

message NodeBuyItemRequest {
    MapAuthority authority = 1;
    string username = 2;
    string item = 3;
}

message NodePlayerActionResponse {
    string message = 1;
    PlayerState player = 2;
    bool accepted = 3;
}

message NodeAttackRequest {
    MapAuthority authority = 1;
    string username = 2;
}

message NodeAttackResponse {
    string message = 1;
    string target_message = 2;
    string global_message = 3;
    PlayerState player = 4;
    bool accepted = 5;
}

message NodeProfileRequest {
    string map_id = 1;
    string username = 2;
}

message NodeProfileResponse {
    PlayerState player = 1;
    bool found = 2;
}

message NodeRewardPlayerRequest {
    MapAuthority authority = 1;
    string username = 2;
    int32 treasure_delta = 3;
    int32 victory_delta = 4;
}

message NodeSnapshotRequest {
    string map_id = 1;
}

message NodeSnapshotResponse {
    MapView map = 1;
}

message NodeCountsRequest {
    string map_id = 1;
}

message NodeCountsResponse {
    int32 players = 1;
    int32 npcs = 2;
    int32 treasures = 3;
    int64 version = 4;
}

message NodeCheckpointRequest {
    string map_id = 1;
}

message NodeCheckpointResponse {
    NodeCheckpoint checkpoint = 1;
}

// NodeCheckpoint uses protobuf Timestamp rather than a string timestamp so an
// invalid wire timestamp is rejected by protobuf validation before promotion.
message NodeCheckpoint {
    string map_id = 1;
    string node_id = 2;
    int64 version = 3;
    repeated string terrain = 4;
    repeated PlayerView players = 5;
    repeated NPCView npcs = 6;
    repeated TreasureView treasures = 7;
    google.protobuf.Timestamp captured_at = 8;
    uint64 map_epoch = 9;
}

message NodePromoteRequest {
    MapAuthority authority = 1;
    NodeCheckpoint checkpoint = 2;
}

message NodePromoteResponse {}

message NodeViewRequest {}

message NodeViewResponse {
    NodeView view = 1;
}
